name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 版本由 package.json 的 packageManager 决定（pnpm@11.7.0），
      # 这里再写一个 version 会撞 ERR_PNPM_BAD_PM_VERSION。
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `check` 里引用了 scripts/clean.mjs 与 scripts/check-standalone.mjs，
      # 但这两个文件并没有进仓库（本地也不存在），全新 clone 跑不起来。
      # 先只跑测试；等脚本补进仓库再把这里换成 `pnpm run check`。
      - run: pnpm test
